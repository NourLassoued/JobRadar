<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <title th:text="${headline}">JobRadar</title>
</head>
<body style="margin:0; padding:0; background:#f3f5f4; -webkit-font-smoothing:antialiased;">
<!-- Texte d'aperçu (affiché par Gmail à côté de l'objet) -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;" th:text="${preheader}">Aperçu</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f5f4;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:560px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#17202a;">

                <!-- Logo -->
                <tr>
                    <td style="padding:0 4px 20px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="width:32px; height:32px; background:#155e63; border-radius:9px; text-align:center; vertical-align:middle; color:#ffffff; font-size:16px; font-weight:700; line-height:32px;">J</td>
                                <td style="padding-left:10px; font-size:17px; font-weight:700; letter-spacing:-0.2px; color:#17202a;">JobRadar</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Carte principale -->
                <tr>
                    <td style="background:#ffffff; border:1px solid #dde2e5; border-radius:14px; overflow:hidden;">
                        <div th:style="'height:5px; background:' + ${accent} + ';'" style="height:5px; background:#155e63;"></div>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="padding:28px 28px 8px;">
                    <span th:if="${label != null}"
                          th:style="'display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; background:' + ${accentSoft} + '; color:' + ${accent} + ';'"
                          style="display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#e2efee; color:#155e63;"
                          th:text="${label}">Étiquette</span>

                                    <h1 style="margin:16px 0 0; font-size:22px; line-height:1.3; font-weight:700; color:#17202a;" th:text="${headline}">Titre</h1>
                                    <p style="margin:12px 0 0; font-size:15px; line-height:1.6; color:#3a4652;" th:text="${greeting}">Bonjour,</p>
                                    <p th:if="${intro != null}" style="margin:8px 0 0; font-size:15px; line-height:1.6; color:#3a4652;" th:text="${intro}">Texte</p>
                                </td>
                            </tr>

                            <!-- Carte : offre ou candidat -->
                            <tr th:if="${cardTitle != null}">
                                <td style="padding:16px 28px 0;">
                                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                           style="background:#f7f8f8; border:1px solid #dde2e5; border-radius:10px;">
                                        <tr>
                                            <td style="padding:14px 16px;">
                                                <div style="font-size:12px; color:#66727e; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;" th:text="${cardLabel}">Offre</div>
                                                <div style="margin-top:4px; font-size:15px; font-weight:700; color:#17202a;" th:text="${cardTitle}">Poste</div>
                                                <div th:if="${cardSubtitle != null}" style="margin-top:2px; font-size:14px; color:#3a4652;" th:text="${cardSubtitle}">Entreprise</div>
                                            </td>
                                            <td th:if="${highlight != null}" align="right" style="padding:14px 16px; vertical-align:middle; white-space:nowrap;">
                          <span th:style="'display:inline-block; padding:6px 10px; border-radius:8px; font-size:13px; font-weight:700; background:' + ${accentSoft} + '; color:' + ${accent} + ';'"
                                style="display:inline-block; padding:6px 10px; border-radius:8px; font-size:13px; font-weight:700;"
                                th:text="${highlight}">91 %</span>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Encadré facultatif -->
                            <tr th:if="${quote != null}">
                                <td style="padding:16px 28px 0;">
                                    <div style="font-size:12px; color:#66727e; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;" th:text="${quoteLabel}">Message</div>
                                    <div th:style="'margin-top:6px; padding:12px 14px; border-left:3px solid ' + ${accent} + '; background:#fbfcfc; font-size:15px; line-height:1.6; color:#17202a; white-space:pre-line;'"
                                         style="margin-top:6px; padding:12px 14px; border-left:3px solid #155e63; background:#fbfcfc; font-size:15px; line-height:1.6;"
                                         th:text="${quote}">Texte</div>
                                </td>
                            </tr>

                            <!-- Étapes -->
                            <tr th:if="${!#lists.isEmpty(steps)}">
                                <td style="padding:20px 28px 0;">
                                    <div style="font-size:12px; color:#66727e; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;" th:text="${stepsLabel}">Et maintenant ?</div>
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:8px;">
                                        <tr th:each="step, i : ${steps}">
                                            <td style="vertical-align:top; padding:3px 10px 3px 0;">
                          <span th:style="'display:inline-block; width:20px; height:20px; border-radius:50%; text-align:center; font-size:12px; font-weight:700; line-height:20px; background:' + ${accentSoft} + '; color:' + ${accent} + ';'"
                                style="display:inline-block; width:20px; height:20px; border-radius:50%; text-align:center; font-size:12px; line-height:20px;"
                                th:text="${i.count}">1</span>
                                            </td>
                                            <td style="padding:3px 0; font-size:14px; line-height:1.5; color:#3a4652;" th:text="${step}">Étape</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Bouton -->
                            <tr th:if="${ctaUrl != null}">
                                <td style="padding:24px 28px 28px;">
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                        <tr>
                                            <td th:style="'border-radius:10px; background:' + ${accent} + ';'" style="border-radius:10px; background:#155e63;">
                                                <a th:href="${ctaUrl}" href="#" target="_blank"
                                                   style="display:inline-block; padding:12px 22px; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px;"
                                                   th:text="${ctaLabel}">Ouvrir JobRadar</a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr th:if="${ctaUrl == null}"><td style="height:24px;"></td></tr>
                        </table>
                    </td>
                </tr>

                <!-- Pied de page -->
                <tr>
                    <td style="padding:20px 8px 0; font-size:12px; line-height:1.6; color:#66727e; text-align:center;">
                        <span th:text="${footer}">Vous recevez cet e-mail car vous utilisez JobRadar.</span><br>
                        <a th:href="${appUrl}" href="#" style="color:#155e63; text-decoration:underline;">Ouvrir JobRadar</a>
                        <br>© <span th:text="${year}">2026</span> JobRadar
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
