<section class="sectors" id="secteurs" aria-labelledby="sectors-title">
  <div class="sectors__inner">

    <header class="sectors__head">
      <div>
        <p class="eyebrow">Secteurs</p>
        <h2 class="sectors__title" id="sectors-title">
          {{ sectors.length }} familles de métiers, un seul outil.
        </h2>
      </div>
      <p class="sectors__sub">
        Les offres viennent du référentiel ROME de France Travail. La tech y a sa place,
        mais aussi la santé, le BTP, la logistique ou la restauration.
      </p>
    </header>

    <ul class="grid">
      @for (s of sectors; track s.code) {
        <li>
          <a class="tile" routerLink="/app/offres" [queryParams]="{ secteur: s.code }"
             [attr.aria-label]="'Voir les offres du secteur ' + s.label">
            <span class="tile__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path [attr.d]="s.icon" /></svg>
            </span>
            <span class="tile__label">{{ s.label }}</span>
            <i class="ti ti-arrow-up-right tile__arrow" aria-hidden="true"></i>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
