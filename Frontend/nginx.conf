# nginx du frontend JobRadar dans Kubernetes
# - sert l'application Angular
# - relaie /api et les routes OAuth2 vers le backend (service "jobradar-backend")
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;   # envoi de CV PDF

    location /api/ {
        proxy_pass http://jobradar-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://jobradar-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routes Angular : rafraîchir une page ne doit pas donner 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
