# Étapes communes : construire l'image Docker, la publier sur GHCR,
# puis écrire la nouvelle version dans le dépôt jobradar-gitops (ArgoCD déploie ensuite tout seul).
name: _build-deploy

on:
  workflow_call:
    inputs:
      component:   # backend | frontend
        required: true
        type: string
      context:     # dossier du Dockerfile : Backend | Frontend
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

permissions:
  contents: read
  packages: write   # publier l'image sur ghcr.io

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nourlassoued/jobradar-${{ inputs.component }}
      MANIFEST: base/${{ inputs.component }}.yaml
    steps:
      - name: Récupérer le code de JobRadar
        uses: actions/checkout@v4

      - name: Choisir la version (sha-<7 premiers caractères du commit>)
        id: version
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Préparer Docker
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}

      - name: Récupérer le dépôt GitOps
        uses: actions/checkout@v4
        with:
          repository: NourLassoued/jobradar-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Écrire la nouvelle version dans GitOps et pousser
        working-directory: gitops
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # remplace « jobradar-xxx:<ancienne version> » par « jobradar-xxx:<nouvelle version> »
          sed -i -E "s|(image: ${IMAGE}:)[^[:space:]#]+|\1${TAG}|" "$MANIFEST"
          if [ "$(grep -c "image: ${IMAGE}:${TAG}" "$MANIFEST")" != "1" ]; then
            echo "::error::Ligne image introuvable dans $MANIFEST"; exit 1
          fi
          if git diff --quiet; then
            echo "Déjà à la version ${TAG} : rien à faire."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${{ inputs.component }} ${TAG}"
          # si quelqu'un a poussé entre-temps : on se remet à jour et on réessaie (3 fois)
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::error::Push vers jobradar-gitops impossible"; exit 1
